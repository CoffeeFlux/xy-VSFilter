name: Rust compatibility foundation

on:
  push:
    branches: ['rust/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ownership:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust ownership boundary with Miri
        run: |
          rustup toolchain install nightly-2025-02-20 --profile minimal --component miri
          cargo +nightly-2025-02-20 miri test --workspace --locked
  portable:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            python_arch: arm64
            msvc_arch: x64
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            python_arch: x64
            msvc_arch: x64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            python_arch: x64
            msvc_arch: x64
          - os: windows-2022
            target: i686-pc-windows-msvc
            python_arch: x86
            msvc_arch: amd64_x86
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: ${{ matrix.msvc_arch }}
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt --component clippy --target ${{ matrix.target }}
          rustup default 1.85.0
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked --offline --target ${{ matrix.target }}
      - run: cargo clippy --workspace --all-targets --locked --offline --target ${{ matrix.target }} -- -D warnings
      - name: Check production runtime
        if: runner.os == 'Windows'
        run: cargo clippy -p xy-vsfilter-ffi --lib --release --features native-runtime --locked --offline --target ${{ matrix.target }} -- -D warnings
      - run: python tools/compat/make_corpus.py --check
      - run: python -m unittest discover -s tools/compat -p "test_*.py" -v
      - name: Compare original C++ with Rust through the C ABI
        run: python tools/compat/check_decoder.py --target ${{ matrix.target }}
      - name: Sanitize the native decoder boundary
        if: runner.os != 'Windows'
        run: python tools/compat/check_decoder.py --target ${{ matrix.target }} --sanitize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: decoder-evidence-${{ matrix.target }}
          path: artifacts/decoder/**/report.json
