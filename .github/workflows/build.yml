name: Build VSFilter

on:
  push:
    branches: [ci, xy_sub_filter_rc*, vsfilter_rc*, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - vsfplat: x64
            namesuf: x86-64
          - vsfplat: Win32
            namesuf: x86-32
    defaults:
      run:
        shell: 'bash'
    env:
      YASM_VERSION: '1.3.0'
      YASM_SHA256: 'd160b1d97266f3f28a71b4420a0ad2cd088a7977c2dd3b25af155652d8d8d91f'
      # yasm 1.3.0 links against MSVCR100.dll, which windows-2022 doesn't ship
      VCREDIST2010_URL: 'https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe'
      VCREDIST2010_SHA256: 'f3b7a76d84d23f91957aa18456a14b4e90609e4ce8194c5653384ed38dada6f3'

    steps:
      - name: Determine configuration
        id: config
        run: |
          # base name of GHA artifact
          name="VSFilter+SubFilter"
          # space delimited list of filename stems to delete from artifact
          delete=""

          # If it runs for one of the main XySubFilter or xy-VSFilter dev branches,
          # only publish compatible binaries. If it's some other branch, it's probably
          # a transient testing build, so keep everything.
          # ref.: https://github.com/Cyberbeing/xy-VSFilter/pull/18#issuecomment-1302638201
          REF="$GITHUB_REF_NAME"
          if [ "$REF" = "master" ] || [ "$REF" = "vsfilter_rc" ] ; then
              name="VSFilter"
              delete="XySubFilter"
          # xy-VSFilter specific changes weren't merged back into the
          # XySubFilter branch, so it normally shouldn't be used to build
          # xy-VSFilter. But in pinterf/xy-VSFilter there’s only one branch.
          #elif echo "$REF" | grep -qE '^xy_sub_filter_rc' ; then
          #    name="SubFilter"
          #    delete="VSFilter"
          fi

          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "delete=$delete" >> "$GITHUB_OUTPUT"

      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: install yasm
        run: |
          redist="$(cygpath -u "$RUNNER_TEMP")/vcredist2010_x64.exe"
          curl -fsSL --retry 3 -o "$redist" "$VCREDIST2010_URL"
          echo "${VCREDIST2010_SHA256}  $redist" | sha256sum -c -
          # 1638: a newer version is already installed; 3010: reboot required
          rc=0
          MSYS2_ARG_CONV_EXCL='*' "$redist" /q /norestart || rc=$?
          if [ "$rc" != 0 ] && [ "$rc" != 1638 ] && [ "$rc" != 3010 ] ; then
              echo "VC++ 2010 redistributable install failed: $rc" >&2
              exit 1
          fi

          yasm_dir="$(cygpath -u "$RUNNER_TEMP")/yasm"
          mkdir -p "$yasm_dir"
          curl -fsSL --retry 3 -o "$yasm_dir/yasm.exe" \
              "https://github.com/yasm/yasm/releases/download/v${YASM_VERSION}/yasm-${YASM_VERSION}-win64.exe"
          echo "${YASM_SHA256}  $yasm_dir/yasm.exe" | sha256sum -c -
          "$yasm_dir/yasm.exe" --version
          cygpath -w "$yasm_dir" >> "$GITHUB_PATH"

      - name: Locate Visual Studio
        run: |
          vs_path="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)"
          if [ -z "$vs_path" ] ; then
              echo "Visual Studio with C++ tools not found" >&2
              exit 1
          fi
          echo "VS170COMNTOOLS=$vs_path/Common7/Tools/" >> "$GITHUB_ENV"

      - name: Build xy-VSFilter and/or XySubFilter
        run: |
          # Version info in version_in.h is maintained by hand, so don't regenerate it
          bash ./build_vsfilter.sh -platform "${{ matrix.vsfplat }}" -compiler VS2022 -voff
          cp License.txt bin/

      - name: Check binary hardening
        run: |
          msvc_dir="$(cygpath -u "$VS170COMNTOOLS")../../VC/Tools/MSVC"
          dumpbins=("$msvc_dir"/*/bin/Hostx64/x64/dumpbin.exe)
          dumpbin="$(printf '%s\n' "${dumpbins[@]}" | sort -V | tail -1)"
          required=("Dynamic base" "NX compatible" "Control Flow Guard" "CET compatible")
          if [ "${{ matrix.vsfplat }}" = x64 ] ; then
              required+=("High Entropy Virtual Addresses")
          fi
          fail=0
          for dll in bin/lib*/*/Release/*.dll ; do
              headers="$("$dumpbin" -nologo -headers "$dll")"
              for flag in "${required[@]}" ; do
                  if ! grep -qF "$flag" <<< "$headers" ; then
                      echo "::error::$dll: missing '$flag'"
                      fail=1
                  fi
              done
              # .rdata must stay a separate, non-executable section
              if ! grep -qE '^ +\.rdata name$' <<< "$headers" ; then
                  echo "::error::$dll: no .rdata section (merged into .text?)"
                  fail=1
              fi
              if [ "${{ matrix.vsfplat }}" = Win32 ] &&
                 ! "$dumpbin" -nologo -loadconfig "$dll" | grep -qF "Safe Exception Handler Table" ; then
                  echo "::error::$dll: no SafeSEH table"
                  fail=1
              fi
              echo "$dll: checked"
          done
          exit $fail

      - name: Prune incompatible files
        if: steps.config.outputs.delete != ''
        run: |
          for dir in bin/lib*/*/Release ; do
              for bn in ${{ steps.config.outputs.delete }} ; do
                  rm -f "$dir"/"$bn".*
              done
          done

      - name: Publish output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xy-${{ steps.config.outputs.name }}_nightly_${{ matrix.namesuf }}
          if-no-files-found: error
          path: |
            bin/lib*/*/Release
            bin/License.txt

      # Runs after publishing so unit_test.exe stays out of the artifact (it shares
      # the Release output dir). Only compiled to catch breakage; running it needs
      # a script argument and test data.
      - name: Build unit tests
        run: bash ./build_vsfilter.sh -platform "${{ matrix.vsfplat }}" -compiler VS2022 -voff -proj unit_test
