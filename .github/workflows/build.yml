name: Build VSFilter

on:
  push:
    branches: [ci, xy_sub_filter_rc*, vsfilter_rc*, master, aegisub*]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: 'bash'

    steps:
      - name: checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Locate Visual Studio
        run: |
          vs_path="$("/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' \
              -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)"
          if [ -z "$vs_path" ] ; then
              echo "Visual Studio with C++ tools not found" >&2
              exit 1
          fi
          echo "VS170COMNTOOLS=$vs_path/Common7/Tools/" >> "$GITHUB_ENV"

      - name: Build VSFilter (CSRI)
        run: |
          # Version info in version_in.h is maintained by hand, so don't regenerate it
          bash ./build_vsfilter.sh -platform "x64" -compiler VS2022 -voff
          cp License.txt bin/

      - name: Check binary hardening
        run: |
          msvc_dir="$(cygpath -u "$VS170COMNTOOLS")../../VC/Tools/MSVC"
          dumpbins=("$msvc_dir"/*/bin/Hostx64/x64/dumpbin.exe)
          dumpbin="$(printf '%s\n' "${dumpbins[@]}" | sort -V | tail -1)"
          required=("Dynamic base" "NX compatible" "Control Flow Guard" "CET compatible" "High Entropy Virtual Addresses")
          fail=0
          for dll in bin/lib*/*/Release/*.dll ; do
              headers="$("$dumpbin" -nologo -headers "$dll")"
              for flag in "${required[@]}" ; do
                  if ! grep -qF "$flag" <<< "$headers" ; then
                      echo "::error::$dll: missing '$flag'"
                      fail=1
                  fi
              done
              # .rdata must stay a separate, non-executable section
              if ! grep -qE '^ +\.rdata name$' <<< "$headers" ; then
                  echo "::error::$dll: no .rdata section (merged into .text?)"
                  fail=1
              fi
              echo "$dll: checked"
          done
          exit $fail

      - name: Publish output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: xy-VSFilter-CSRI_nightly_x86-64
          if-no-files-found: error
          path: |
            bin/lib*/*/Release
            bin/License.txt

      # Runs after publishing so unit_test.exe stays out of the artifact (it shares
      # the Release output dir).
      - name: Build unit tests
        run: bash ./build_vsfilter.sh -platform "x64" -compiler VS2022 -voff -proj unit_test

      # OverallTest needs a script argument and is skipped; MemoryOpen compares
      # every test/*.ass rendered from a file against the same script from memory,
      # Blit checks the frame copies and colorspace conversions, and Interned checks
      # the value interning the subtitle renderer relies on.
      - name: Run unit tests
        timeout-minutes: 15
        env:
          XY_TEST_DATA: test
        run: |
          exe=(bin/lib*/"x64"/Release/unit_test.exe)
          "${exe[0]}"
