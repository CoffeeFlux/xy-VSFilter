name: Windows renderer differential

on:
  workflow_dispatch:
    inputs:
      mutation_count:
        description: Additional reproducible malformed-input cases (0 to 256)
        type: number
        default: 32
      mutation_seed:
        description: Reproducible u32 seed
        type: number
        default: 12345
  push:
    branches: ['rust/**']
    paths:
      - '.github/workflows/native-compat.yml'
      - 'rust/**'
      - 'include/xy_rust_text.h'
      - 'include/xy_rust_document.h'
      - 'include/xy_rust_ass.h'
      - 'include/xy_rust_reader.h'
      - 'include/xy_rust_drawing.h'
      - 'include/xy_rust_drawing_tokens.h'
      - 'include/xy_rust_fields.h'
      - 'include/xy_rust_segments.h'
      - 'include/xy_rust_segment_insert.h'
      - 'include/xy_rust_hdmv.h'
      - 'include/xy_rust_dvb.h'
      - 'include/xy_rust_golomb.h'
      - 'include/xy_rust_fill.h'
      - 'include/xy_rust_mask.h'
      - 'include/xy_rust_bilinear.h'
      - 'include/xy_rust_be_blur.h'
      - 'include/xy_rust_be_filter.h'
      - 'include/xy_rust_transpose.h'
      - 'include/xy_rust_byte_float.h'
      - 'include/xy_rust_gauss_integer.h'
      - 'include/xy_rust_vobsub.h'
      - 'include/xy_rust_timeline_search.h'
      - 'src/**'
      - 'tools/compat/**'
      - 'test/compat/**'

permissions:
  contents: read

jobs:
  style_api_compile:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
          - platform: Win32
            arch: amd64_x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4911cacb102bc0cbd41449793e54473265b04e62
          path: baseline-compile
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile style API and lifecycle probes against reference and candidate headers
        shell: pwsh
        run: |
          & python tools\compat\document_style_api_compile.py --reference-root "$pwd\baseline-compile" --platform ${{ matrix.platform }} --output "artifacts\document-style-api-compile\${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) { throw "Document probe compile-only check failed; inspect report.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-style-api-compile-${{ matrix.platform }}
          path: artifacts/document-style-api-compile/${{ matrix.platform }}/
  document_preparation:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
          - platform: Win32
            arch: amd64_x86
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 4911cacb102bc0cbd41449793e54473265b04e62
          path: baseline-preparation
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture pinned document preparation with actual Windows strings
        shell: pwsh
        run: |
          & python tools\compat\document_prepare_check.py --reference-root "$pwd\baseline-preparation" --platform ${{ matrix.platform }} --output "artifacts\document-preparation\${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) { throw "Document preparation capture incomplete; inspect report.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-preparation-${{ matrix.platform }}
          path: artifacts/document-preparation/${{ matrix.platform }}/
  atl_contract:
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
            target: x86_64-pc-windows-msvc
          - platform: Win32
            arch: amd64_x86
            target: i686-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture installed ATL named-style map contract
        shell: pwsh
        run: |
          & python tools\compat\document_atl_contract.py --platform ${{ matrix.platform }} --output "artifacts\document-atl-contract\${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) { throw "ATL contract capture incomplete; inspect report.json" }
      - name: Install pinned Rust for map comparison
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target ${{ matrix.target }}
          rustup default 1.85.0
      - name: Compare safe Rust named-style map histories
        shell: pwsh
        run: |
          & python tools\compat\document_style_map_check.py --native-contract "artifacts\document-atl-contract\${{ matrix.platform }}" --target ${{ matrix.target }} --output "artifacts\document-style-map\${{ matrix.platform }}"
          if ($LASTEXITCODE -ne 0) { throw "Safe named-style map comparison failed; inspect report.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-atl-contract-${{ matrix.platform }}
          path: artifacts/document-atl-contract/${{ matrix.platform }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-style-map-${{ matrix.platform }}
          path: |
            artifacts/document-style-map/${{ matrix.platform }}/report.json
            artifacts/document-style-map/${{ matrix.platform }}/*.stdout
            artifacts/document-style-map/${{ matrix.platform }}/*.stderr
            artifacts/document-style-map/${{ matrix.platform }}/cargo-target/**/release/examples/document_style_map_trace.exe
  renderer:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        document_storage: [native, rust-experimental]
        include:
          - platform: x64
            arch: x64
            target: x86_64-pc-windows-msvc
            python_arch: x64
          - platform: Win32
            arch: amd64_x86
            target: i686-pc-windows-msvc
            python_arch: x86
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          path: baseline
          ref: 4911cacb102bc0cbd41449793e54473265b04e62
      - uses: actions/checkout@v4
        with:
          repository: ShiftMediaProject/VSYASM
          ref: 0b3840076a6cbb1574e031a3a2688554cb09d82a
          path: VSYASM
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Install YASM's VC2010 runtime and pin the assembler binary
        shell: pwsh
        run: |
          # URL/checksum from Microsoft's winget manifest for VCRedist.2010.x64.
          $runtime = Join-Path $env:RUNNER_TEMP "vcredist-2010-x64.exe"
          Invoke-WebRequest https://download.microsoft.com/download/1/6/5/165255E7-1014-4D0A-B094-B6A430A6BFFC/vcredist_x64.exe -OutFile $runtime
          if ((Get-FileHash $runtime).Hash -ne "F3B7A76D84D23F91957AA18456A14B4E90609E4CE8194C5653384ED38DADA6F3") { throw "Runtime checksum mismatch" }
          $installation = Start-Process $runtime -ArgumentList '/quiet','/norestart' -Wait -PassThru
          if ($installation.ExitCode -notin @(0, 3010, 1638)) { throw "VC2010 runtime installation failed: $($installation.ExitCode)" }
          $assembler = "VSYASM\yasm_1.3.0_win64.exe"
          Invoke-WebRequest https://www.tortall.net/projects/yasm/releases/yasm-1.3.0-win64.exe -OutFile $assembler
          if ((Get-FileHash $assembler).Hash -ne "D160B1D97266F3F28A71B4420A0AD2CD088A7977C2DD3B25AF155652D8D8D91F") { throw "YASM checksum mismatch" }
      - name: Install original assembler integration
        shell: cmd
        run: call VSYASM\install_script.bat
      - name: Select the installed YASM executable
        shell: pwsh
        run: |
          "$env:VCINSTALLDIR" | Out-File -FilePath $env:GITHUB_PATH -Append
          & "$env:VCINSTALLDIR\yasm.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Installed YASM cannot run" }
      - name: Install Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal --target ${{ matrix.target }}
          rustup default 1.85.0
      - name: Build the reference and candidate and compare actual DLLs
        shell: pwsh
        env:
          XY_MUTATION_COUNT: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.mutation_count) || '32' }}
          XY_MUTATION_SEED: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.mutation_seed) || '12345' }}
          XY_RUST_DOCUMENT_OWNER: ${{ matrix.document_storage == 'rust-experimental' && 'true' || 'false' }}
        run: |
          & candidate\tools\compat\run_native_comparison.ps1 -Platform ${{ matrix.platform }} -Baseline "$pwd\baseline" -MutationCount ([int]$env:XY_MUTATION_COUNT) -MutationSeed ([uint32]$env:XY_MUTATION_SEED) -RustDocumentOwner:($env:XY_RUST_DOCUMENT_OWNER -eq 'true')
      - name: Compare complete native and Rust style values independently
        if: ${{ !cancelled() && matrix.document_storage == 'rust-experimental' }}
        shell: pwsh
        run: |
          & python candidate\tools\compat\document_style_value_check.py --reference-root "$pwd\baseline" --candidate-root "$pwd\candidate" --platform ${{ matrix.platform }} --output "$pwd\candidate\artifacts\native\${{ matrix.platform }}\document-style-value"
          if ($LASTEXITCODE -ne 0) { throw "Style value comparison failed; inspect document-style-value/report.json" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renderer-evidence-${{ matrix.platform }}${{ matrix.document_storage == 'rust-experimental' && '-rust-document' || '' }}
          path: |
            candidate/artifacts/native/
            candidate/bin/lib*/**/Release/*.dll
            baseline/bin/lib*/**/Release/*.dll
